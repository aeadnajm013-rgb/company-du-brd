<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Apps Script Integration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b132b;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* شێوازی دوگمەکە */
    .btn-link {
      display: inline-block;
      padding: 12px 24px;
      margin: 15px 0;
      background-color: #00ffcc;
      color: #0b132b;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ffcc;
      transition: 0.3s;
    }

    .btn-link:hover {
      box-shadow: 0 0 20px #00ffcc;
      transform: scale(1.05);
    }

    /* شێوازی iframe */
    iframe {
      width: 100%;
      height: 500px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      margin-top: 20px;
    }

    /* بەشی نیشاندانی داتای Fetch */
    #data-container {
      margin-top: 20px;
      padding: 15px;
      background-color: #1c2541;
      border-radius: 8px;
      border: 1px solid #3a506b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>بەستنەوەی Google Apps Script</h2>

    <!-- ڕێگای ١: دوگمەی لینک -->
    <a href="https://script.google.com/macros/s/AKfycbyD6kg0IkLwC-Gw9I9haAVnJEvxEbVFBn5PlnshFewegYU4kPVcCoQej6Iv4sooNsHADQ/exec" 
       target="_blank" 
       class="btn-link">
      کردنەوە لە پەڕەیەکی نوێدا
    </a>

    <!-- ڕێگای ٢: نمایشکردن لە ناو iframe -->
    <h3>پێشاندانی پەڕەکە لەناو بەشێکدا:</h3>
    <iframe src="https://script.google.com/macros/s/AKfycbyD6kg0IkLwC-Gw9I9haAVnJEvxEbVFBn5PlnshFewegYU4kPVcCoQej6Iv4sooNsHADQ/exec"></iframe>

    <!-- ڕێگای ٣: بەشی ئامادەکراو بۆ هێنانی داتا لە ڕێگەی JavaScript -->
    <div id="data-container">
      <p id="status">داتاکان لە بارکردنداند...</p>
    </div>
  </div>

  <script>
    // URLی سەرەکی Apps Script
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbyD6kg0IkLwC-Gw9I9haAVnJEvxEbVFBn5PlnshFewegYU4kPVcCoQej6Iv4sooNsHADQ/exec';

    // ڕێگای ٣: هێنانی زانیاری (Fetch Data)
    fetch(scriptUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error('کێشەیەک لە پەیوەندیدا هەیە');
        }
        return response.json();
      })
      .then(data => {
        document.getElementById('status').innerText = "داتاکان بە سەرکەوتوویی وەرگیران!";
        console.log("داتای وەرگیراو:", data);
      })
      .catch(error => {
        document.getElementById('status').innerText = "نەتوانرا داتاکان بهێنرێت یان شێوازی وەڵامەکە JSON نییە.";
        console.error('خەتا:', error);
      });
  </script>

</body>
</html>
