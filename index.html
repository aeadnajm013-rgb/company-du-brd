<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPANY DU BRA - زانیاری ئەکاونت</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: #0f172a;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            padding: 30px 25px;
            text-align: center;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .z-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .company-title {
            font-size: 18px;
            color: #f8fafc;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .company-title span {
            color: #3b82f6;
        }

        /* خانەی بچووکی ژمارەی ئەکاونت لە ژێر لۆگۆ */
        .account-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .account-badge span {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }
        .account-badge input {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-size: 14px;
            font-weight: 700;
            width: 70px;
            outline: none;
            text-align: center;
        }

        .loading, .error-msg {
            padding: 20px;
            color: #94a3b8;
            font-size: 15px;
        }
        .error-msg {
            color: #f87171;
        }
        
        .field-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: block;
        }
        .input-with-copy {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .input-with-copy:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .field-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            color: #f1f5f9;
            outline: none;
            width: 100%;
        }
        .copy-btn {
            background: rgba(51, 65, 85, 0.5);
            border: none;
            padding: 0 15px;
            cursor: pointer;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 45px;
        }
        .copy-btn:hover {
            background: #3b82f6;
            color: #ffffff;
        }
        
        .action-fetch-box {
            margin-top: 15px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            text-align: right;
        }
        .fetch-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            cursor: pointer;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
        }
        .fetch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لۆگۆ و ژمارەی ئەکاونت -->
        <div class="logo-container">
            <div class="z-logo">Z</div>
            <div class="company-title">COMPANY <span>DU BRA</span></div>
            
            <div class="account-badge">
                <span>ئەکاونت:</span>
                <input type="text" id="accSmallInput" value="" readonly>
            </div>
        </div>

        <div id="content">
            <div class="loading">چاوەڕوان بە، زانیارییەکان دەهێنرێن...</div>
        </div>
    </div>

    <div id="toast" class="toast">بە سەرکەوتوویی کۆپی کرا!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accountNumber = urlParams.get('account');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQTQ1ISmZI6mX9QCqIbZiXO4-uc0bthCrO9Nmu1FO0xX8L_6Eoap9SEm3P9ZEwZNPW/exec';

        if (!accountNumber) {
            document.getElementById('content').innerHTML = '<div class="error-msg">تکایە ژمارەی ئەکاونت لە لینکەکەدا دیاری بکە (نموونە: ?account=1)</div>';
        } else {
            // دانانی ژمارەی ئەکاونت لە باجە بچووکەکەی سەرەوە ڕاستەوخۆ
            document.getElementById('accSmallInput').value = accountNumber;

            fetch(`${scriptURL}?account=${accountNumber}`)
                .then(response => response.json())
                .then(res => {
                    if (res.status === 'success') {
                        let d = res.data;
                        document.getElementById('content').innerHTML = `
                            <!-- ئیمەیل (Email) -->
                            <div class="field-group">
                                <label class="field-label">ئیمەیل (Email)</label>
                                <div class="input-with-copy">
                                    <input type="text" id="emailInput" class="field-input" value="${d.email || ''}" readonly>
                                    <button class="copy-btn" onclick="copyText('emailInput')">کۆپی</button>
                                </div>
                            </div>

                            <!-- پاسوۆرد (Password) -->
                            <div class="field-group">
                                <label class="field-label">پاسوۆرد (Password)</label>
                                <div class="input-with-copy">
                                    <input type="text" id="passInput" class="field-input" value="${d.password || ''}" readonly>
                                    <button class="copy-btn" onclick="copyText('passInput')">کۆپی</button>
                                </div>
                            </div>

                            <!-- ڕۆژی لەدایکبوون (Birthday) -->
                            <div class="field-group">
                                <label class="field-label">ڕۆژی لەدایکبوون (Birthday)</label>
                                <div class="input-with-copy">
                                    <input type="text" id="bdayInput" class="field-input" value="${d.birthday || ''}" readonly>
                                    <button class="copy-btn" onclick="copyText('bdayInput')">کۆپی</button>
                                </div>
                            </div>

                            <!-- ژمارەی تەلەفۆن (Phone) -->
                            <div class="field-group">
                                <label class="field-label">ژمارەی تەلەفۆن (Phone)</label>
                                <div class="input-with-copy">
                                    <input type="text" id="phoneInput" class="field-input" value="${d.phone || ''}" readonly>
                                    <button class="copy-btn" onclick="copyText('phoneInput')">کۆپی</button>
                                </div>
                            </div>

                            <!-- کۆدی دڵنیایی -->
                            <div class="action-fetch-box">
                                <label class="field-label">کۆدی دڵنیایی</label>
                                <button class="fetch-btn" onclick="fetchTargetLink('${d.link || ''}')">کۆدی دڵنیایی</button>
                                
                                <div class="input-with-copy" style="margin-top: 10px;">
                                    <input type="text" id="fetchedResultInput" class="field-input" value="" readonly>
                                    <button class="copy-btn" onclick="copyText('fetchedResultInput')">کۆپی</button>
                                </div>
                            </div>
                        `;
                    } else {
                        document.getElementById('content').innerHTML = `<div class="error-msg">${res.message}</div>`;
                    }
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = '<div class="error-msg">هەڵەیەک ڕوویدا لە پەیوەندی کردن بە سیستمەوە.</div>';
                    console.error(err);
                });
        }

        function fetchTargetLink(linkUrl) {
            const resultInput = document.getElementById('fetchedResultInput');
            
            if (!linkUrl || linkUrl === '#') {
                resultInput.value = 'هیچ لینکێک بوونی نییە.';
                return;
            }

            resultInput.value = 'خەریکی وەرگرتنە...';

            fetch(linkUrl)
                .then(response => response.text())
                .then(data => {
                    const numbersOnly = data.replace(/[^0-9]/g, '');
                    resultInput.value = numbersOnly || 'هیچ ژمارەیەک نەدۆزرایەوە';
                })
                .catch(error => {
                    resultInput.value = 'هەڵە لە هێنانی زانیاری';
                });
        }

        function copyText(elementId) {
            const inputElement = document.getElementById(elementId);
            inputElement.select();
            inputElement.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputElement.value);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>

</body>
</html>
