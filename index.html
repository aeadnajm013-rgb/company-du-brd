<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPANY DU BRA - زانیاری ئەکاونت</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Kufi Arabic', 'Poppins', sans-serif;
        }
        
        body {
            background: #030712;
            background: radial-gradient(circle at top, #0f172a 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #2563eb;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            overflow: hidden;
            padding: 30px 25px;
            text-align: center;
            position: relative;
        }

        .whatsapp-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            border: 1px solid #34d399;
            transition: all 0.3s ease;
        }
        .whatsapp-banner:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
        }
        .whatsapp-banner svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        /* لۆگۆی نوێی DB (دوو برا) بە درەوشانەوەی LED */
        .db-logo {
            width: 90px;
            height: 90px;
            background: #0b1329;
            color: #60a5fa;
            font-family: 'Poppins', sans-serif;
            font-size: 38px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 3px solid #2563eb;
            margin-bottom: 12px;
            letter-spacing: -2px;
            position: relative;
            cursor: pointer;
            animation: ledPulse 2s infinite alternate;
        }

        @keyframes ledPulse {
            0% {
                box-shadow: 0 0 10px #2563eb, inset 0 0 10px #2563eb;
                text-shadow: 0 0 5px #60a5fa;
                border-color: #2563eb;
            }
            50% {
                box-shadow: 0 0 25px #3b82f6, inset 0 0 15px #3b82f6;
                text-shadow: 0 0 15px #93c5fd, 0 0 25px #3b82f6;
                border-color: #60a5fa;
                transform: scale(1.03);
            }
            100% {
                box-shadow: 0 0 35px #1d4ed8, inset 0 0 20px #1d4ed8;
                text-shadow: 0 0 20px #60a5fa, 0 0 30px #2563eb;
                border-color: #1d4ed8;
            }
        }

        .company-title {
            font-size: 20px;
            color: #f8fafc;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif;
        }
        .company-title span {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        .account-badge {
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .account-badge span {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .account-badge input {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-size: 15px;
            font-weight: 700;
            width: 75px;
            outline: none;
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .warning-title {
            color: #fca5a5;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        .warning-text {
            color: #fecaca;
            font-size: 13px;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .accept-btn {
            width: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: all 0.2s ease;
        }
        .accept-btn:disabled {
            background: #475569;
            border-color: #64748b;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .loading, .error-msg {
            padding: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
        .error-msg {
            color: #f87171;
        }
        
        .field-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        .input-with-copy {
            display: flex;
            align-items: center;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid #1e40af;
            box-shadow: 0 0 8px rgba(30, 64, 175, 0.2);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .field-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            color: #e2e8f0;
            outline: none;
            width: 100%;
            font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif;
        }
        .copy-btn {
            background: rgba(30, 41, 59, 0.8);
            border: none;
            padding: 0 16px;
            cursor: pointer;
            color: #60a5fa;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 46px;
        }
        .copy-btn:hover {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 0 10px #2563eb;
        }
        
        .action-fetch-box {
            margin-top: 22px;
            background: rgba(3, 7, 18, 0.95);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: right;
        }
        .action-fetch-box .field-label {
            color: #60a5fa;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .fetch-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            color: #ffffff;
            border: 1px solid #60a5fa;
            cursor: pointer;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
            transition: all 0.2s ease;
            margin-bottom: 15px;
        }

        .code-display-box {
            background: #020617;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        .code-input-field {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            width: 100%;
            outline: none;
            letter-spacing: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .timer-text {
            font-size: 11px;
            color: #ef4444;
            text-align: center;
            margin-top: 6px;
            font-weight: 700;
            min-height: 16px;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- دوگمەی واتساپ -->
        <a id="whatsappLink" href="#" target="_blank" class="whatsapp-banner">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            پەیوەندی لە ڕێگەی واتساپەوە
        </a>

        <!-- لۆگۆی DB و ژمارەی ئەکاونت -->
        <div class="logo-container">
            <div class="db-logo">DB</div>
            <div class="company-title">COMPANY <span>DU BRA</span></div>
            
            <div class="account-badge">
                <span>ئەکاونت:</span>
                <input type="text" id="accSmallInput" value="" readonly>
            </div>
        </div>

        <!-- باکسی ئاگاداری بە تایمەری 5 چرکەیی -->
        <div id="warningBox" class="warning-box">
            <div class="warning-title">
                ⚠️ ئاگادارییەکی گرنگ
            </div>
            <div class="warning-text">
                تکایە بەهیچ شێوەیەک ئەم Apple ID لە Settings ی موبایلەکەت داخل مەکە! تەنها لە App Store داخل بکە.
            </div>
            <button id="acceptBtn" class="accept-btn" disabled onclick="acceptAgreement()">
                چاوەڕوان بە (5)...
            </button>
        </div>

        <div id="content" style="display: none;">
            <div class="loading">چاوەڕوان بە، زانیارییەکان دەهێنرێن...</div>
        </div>
    </div>

    <div id="toast" class="toast">بە سەرکەوتوویی کۆپی کرا!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accountNumber = urlParams.get('account');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQTQ1ISmZI6mX9QCqIbZiXO4-uc0bthCrO9Nmu1FO0xX8L_6Eoap9SEm3P9ZEwZNPW/exec';
        let countdownTimer = null;
        let fetchedData = null; // بۆ هەڵگرتنی زانیارییەکان لە پشتەوە

        // دەستپێکردنی ڕاستەوخۆ لە پشتەوە کاتێک پەڕەکە دەکرێتەوە
        if (accountNumber) {
            document.getElementById('accSmallInput').value = accountNumber;
            const phone = "9647517393932";
            const message = encodeURIComponent(`سڵاو، من ئەکاونتی ژمارە ${accountNumber}م هەیە لە کۆمپانیای دوو برا.`);
            document.getElementById('whatsappLink').href = `https://wa.me/${phone}?text=${message}`;

            // هێنانی زانیارییەکان لە پشتەوە دیوارەکە
            fetch(`${scriptURL}?account=${accountNumber}`)
                .then(response => response.json())
                .then(res => {
                    fetchedData = res;
                })
                .catch(err => {
                    fetchedData = { status: 'error', message: 'هەڵەیەک ڕوویدا لە پەیوەندی کردن بە سیستمەوە.' };
                });
        }

        // تایمەری 5 چرکەیی بۆ چاڵاککردنی دوگمەی "من ڕازیم"
        let waitTime = 5;
        const acceptBtn = document.getElementById('acceptBtn');

        const waitTimer = setInterval(() => {
            waitTime--;
            if (waitTime > 0) {
                acceptBtn.innerText = `چاوەڕوان بە (${waitTime})...`;
            } else {
                clearInterval(waitTimer);
                acceptBtn.innerText = "من ڕازیم";
                acceptBtn.disabled = false;
            }
        }, 1000);

        function acceptAgreement() {
            document.getElementById('warningBox').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            if (!accountNumber) {
                document.getElementById('content').innerHTML = '<div class="error-msg">تکایە ژمارەی ئەکاونت لە لینکەکەدا دیاری بکە (نموونە: ?account=1)</div>';
                return;
            }

            // ئەگەر زانیارییەکان گەشتبوون نیشانی بدە، ئەگەر نا چاوەڕوان بە
            if (fetchedData) {
                renderData(fetchedData);
            } else {
                // ئەگەر پەیوەندییەکە لە پشتەوە هێشتا تەواو نەبووبوو
                const checkInterval = setInterval(() => {
                    if (fetchedData) {
                        clearInterval(checkInterval);
                        renderData(fetchedData);
                    }
                }, 200);
            }
        }

        function renderData(res) {
            if (res.status === 'success') {
                let d = res.data;
                document.getElementById('content').innerHTML = `
                    <div class="field-group">
                        <label class="field-label">ئیمەیل (Email)</label>
                        <div class="input-with-copy">
                            <input type="text" id="emailInput" class="field-input" value="${d.email || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('emailInput')">کۆپی</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">پاسوۆرد (Password)</label>
                        <div class="input-with-copy">
                            <input type="text" id="passInput" class="field-input" value="${d.password || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('passInput')">کۆپی</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">ڕۆژی لەدایکبوون (Birthday)</label>
                        <div class="input-with-copy">
                            <input type="text" id="bdayInput" class="field-input" value="${d.birthday || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('bdayInput')">کۆپی</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">ژمارەی تەلەفۆن (Phone)</label>
                        <div class="input-with-copy">
                            <input type="text" id="phoneInput" class="field-input" value="${d.phone || ''}" readonly>
                            <button class="copy-btn" onclick="copyText('phoneInput')">کۆپی</button>
                        </div>
                    </div>

                    <div class="action-fetch-box">
                        <label class="field-label">کۆدی دڵنیایی</label>
                        <button class="fetch-btn" onclick="fetchTargetLink('${d.link || ''}')">وەرگرتنی کۆدی دڵنیایی</button>
                        
                        <div class="code-display-box">
                            <input type="text" id="fetchedResultInput" class="code-input-field" value="" placeholder="------" readonly>
                            <button class="copy-btn" style="border-radius: 10px;" onclick="copyText('fetchedResultInput')">کۆپی</button>
                        </div>
                        <div id="timerNotice" class="timer-text"></div>
                    </div>
                `;
            } else {
                document.getElementById('content').innerHTML = `<div class="error-msg">${res.message}</div>`;
            }
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Error");
            }
        }

        function fetchTargetLink(linkUrl) {
            const resultInput = document.getElementById('fetchedResultInput');
            const timerNotice = document.getElementById('timerNotice');
            
            clearInterval(countdownTimer);
            timerNotice.innerText = "";
            playBeepSound();

            if (!linkUrl || linkUrl === '#') {
                resultInput.value = 'لینک نییە';
                return;
            }

            resultInput.value = '...';

            fetch(linkUrl)
                .then(response => response.text())
                .then(data => {
                    const numbersOnly = data.replace(/[^0-9]/g, '');
                    
                    if (numbersOnly) {
                        resultInput.value = numbersOnly;
                        playBeepSound();

                        let timeLeft = 25;
                        timerNotice.innerText = `کۆدەکە دوای ${timeLeft} چرکەی تر دەسڕێتەوە`;

                        countdownTimer = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                timerNotice.innerText = `کۆدەکە دوای ${timeLeft} چرکەی تر دەسڕێتەوە`;
                            } else {
                                clearInterval(countdownTimer);
                                resultInput.value = "";
                                timerNotice.innerText = "کۆدەکە سڕایەوە! کۆتایی هات.";
                            }
                        }, 1000);

                    } else {
                        resultInput.value = 'نەدۆزرایەوە';
                    }
                })
                .catch(error => {
                    resultInput.value = 'هەڵە';
                });
        }

        function copyText(elementId) {
            const inputElement = document.getElementById(elementId);
            if(!inputElement.value) return;

            inputElement.select();
            inputElement.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputElement.value);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>

</body>
</html>
